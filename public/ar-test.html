<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>AR test</title>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>body{font:16px/1.4 system-ui;margin:0;padding:16px;background:#f6f1ea;color:#2b1f16}h2{font-size:16px;margin:20px 0 6px}model-viewer{width:100%;height:260px;background:#e9e1d6;border-radius:10px}button{padding:10px 16px;border-radius:99px;border:0;background:#b4682b;color:#fff;font-weight:600}p{margin:4px 0;font-size:14px}</style></head>
<body>
<h1 style="font-size:20px">AR test</h1>
<p>Tap the AR button on each model. Tell me which ones open the camera.</p>
<h2>A. Google sample (astronaut)</h2>
<model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls><button slot="ar-button">AR – Google sample</button></model-viewer>
<h2>B. Our simple sphere (PNG texture, no Draco)</h2>
<model-viewer src="/assets/models/orn-02-bola-fosil.glb" ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" camera-controls><button slot="ar-button">AR – sphere</button></model-viewer>
<h2>C. Rustic Iron-Leg Table</h2>
<model-viewer src="/assets/models/furn-02-rustic-iron-leg-table-meshy.glb" ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" camera-controls><button slot="ar-button">AR – table</button></model-viewer>
<h2>D. Same table, served from jsDelivr (GitHub CDN)</h2>
<model-viewer src="https://cdn.jsdelivr.net/gh/ferryswa/Petrified_3D@main/public/assets/models/furn-02-rustic-iron-leg-table-meshy.glb" ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" camera-controls><button slot="ar-button">AR – table via CDN</button></model-viewer>
<p id="st"></p>
<script>document.querySelectorAll('model-viewer').forEach((m,i)=>m.addEventListener('ar-status',e=>{document.getElementById('st').textContent+=' '+'ABC'[i]+':'+e.detail.status}))</script>
</body></html>
